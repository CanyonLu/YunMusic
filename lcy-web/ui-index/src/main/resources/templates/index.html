<!DOCTYPE html>
<html lang="en">
<head>

    <title>Yun-Music</title>
    <link rel="stylesheet" href="lib/layui/css/layui.css"/>
    <style>
        body{
            background: rgb(234,236,240);
        }
        .layui-nav{
            background: rgb(254,254,254);
        }
        .layui-nav .layui-nav-item a{
            color: gray;
            font-family: 黑体;
            font-size: 22px;
            font-weight: 500;
        }
        .userinfo{
            font-size: 16px !important;
        }
        .user-input {
            width: 400px;
            height: 40px;
            border: none;

            outline: none;
            text-indent: 10px;
            font-size: 16px;
            font-family: 黑体;
        }
        .user-btn {
            width: 100px;
            height: 40px;
            border: none;
            border-radius: 5px;
            background: rgb(95,184,120);
            vertical-align: sub;
            outline: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
        #logoLi{

        }
        #indexLi{

        #searchLi{

            margin-right: 100px;
        }

<ul class="layui-nav">

        <button class="user-btn" type="button">
            <i class="layui-icon layui-icon-search" style="font-size: 26px"></i>
        </button>
    </li>
    <li class="layui-nav-item" lay-unselect="">
        <a href="javascript:;"><img src="//t.cn/RCzsdCq" class="layui-nav-img"></a>
        <dl class="layui-nav-child">
