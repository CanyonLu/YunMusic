<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="style/style.css"/>
    <link rel="stylesheet" href="lib/layui/css/layui.css"/>
</head>
<body>
    <div class="box">
        <h2>Login</h2>
        <div class="input-box">
            <label>账号</label>
            <input type="text"/>
        </div>
        <div class="input-box">
            <label>密码</label>
            <input type="password"/>
        </div>
        <div class="btn-box">
            <a href="#">忘记密码?</a>
            <div>
                <button>登录</button>
                <button id="register">注册</button>
            </div>
        </div>
    </div>
<script src="lib/jquery-3.4.1/jquery-3.4.1.min.js"></script>
<script src="lib/layui/layui.js"></script>
<script>


    layui.use(['layer'], function () {
        var $ = layui.jquery,
            layer = layui.layer;


        $("#register").click(function () {
            // $(location).attr('href', 'register');

            layer.open({

                type : 2,

                title : "注册",

                maxmin : true,


                area : [ '450px', '500px' ],

                content : '/ui-index/register'

            });
        })
    })





</script>
    
</body>
</html>
