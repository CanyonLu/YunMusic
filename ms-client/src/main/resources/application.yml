server:
  port: 8089
  servlet:
    context-path: /client

spring:
  application:
    name: ms-client
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      url: jdbc:mysql://127.0.0.1:3306/lcy?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
      username: ${DB_USERNAME:root}
      # 本地默认值，部署时用环境变量 DB_PASSWORD 覆盖
      password: ${DB_PASSWORD:583590}
      driver-class-name: com.mysql.cj.jdbc.Driver
  devtools:
    restart:
      exclude: static/**, templates/**
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

# MyBatis
mybatis:
  type-aliases-package: com.lcy.entity
  mapper-locations: classpath:mybatis/**/*Mapper.xml
  config-location: classpath:mybatis/mybatis-config.xml

logging:
  level:
    root: info
    com.lcy: debug
    org.springframework: warn
