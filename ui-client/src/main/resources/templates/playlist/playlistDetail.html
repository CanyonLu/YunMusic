<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>歌单详情</title>
    <link rel="stylesheet" href="lib/layui/css/layui.css"/>
    <link rel="stylesheet" href="style/playlist.css"/>
</head>
<body>
<input hidden id="playlistId" name="playlistId" th:value="${playlistId}">
<div id="main" class="layui-row layui-col-space15">
    <div class="layui-col-md5">
        <div id="left">
            <img id="cover"/>
            <p id="title"></p>
        </div>
    </div>
    <div class="layui-col-md7">
        <div id="right">
            <p id="describe">简介</p>
            <br>
            <p id="describeDetail"></p>
            <br>
            <div id="rateDiv">
                <div>
                    <div class="rateClass">歌单评分</div>
                    <div id="rated"></div>
                </div>
                <div>
                    <div class="rateClass" id="userRate">请评分</div>
                    <div id="unrated"></div>
                </div>
            </div>
            <br>
            <div>
                <a class="playlist-btn-green" href="javascript:;"><i class="layui-icon layui-icon-triangle-r"></i><span>播放全部</span></a>
                <a class="playlist-btn" href="javascript:;"><i class="layui-icon layui-icon-heart"></i><span>收藏歌单</span></a>
            </div>
            <table id="songsTable" lay-filter="songsTable"></table>
        </div>
    </div>
</div>

<script src="js/common.js"></script>
<script type="text/html" id="play">
    <a href="javascript:;" onclick=parent.playmusic('{{d.id}}','{{d.name}}','{{d.singer}}',this)><i class="layui-icon layui-icon-play"></i></a>
</script>
<script>
    var playlistId;
    var newRate;
    let playAllBtn = document.getElementsByClassName('playlist-btn-green')[0];
    let collectBtn = document.getElementsByClassName('playlist-btn')[0];
    var checkCallBack = function (){
        if(loginState){
            $("#userRate").text("已评分");
            layui.rate.render({
                elem: '#unrated'
                ,value: newRate
                ,text: true
                ,readonly:true
                ,setText: function(value){
                    this.span.html('<span style="font-size: 50px">'+ value + '</span>');
                }
            });
        }else {
            layui.layer.confirm('请先登录！', {
                btn: ['确定', '取消'],
                closeBtn: 0,
                title: "",
                skin: "my_skin"
            }, function () {
                parent.location.href = 'login';
            },function () {
                layui.rate.render({
                    elem: '#unrated'
                    ,value: 5
                    ,text: true
                    ,setText: function(value){
                        this.span.html('<span style="font-size: 50px">'+ value + '</span>');
                    }
                    ,choose: function (data) {
                        newRate = data;
                        checkUserState(checkCallBack);
                    }
                });
            })
        }
    };

    $(function () {
        playlistId = $("#playlistId").val();
        checkUserState(checkLogin);
    });

    //播放全部点击事件
    playAllBtn.onclick = function(){
        let songlist = layui.table.cache['songsTable'];
        if(songlist){
            parent.setAudioSrcTitleAndPlay(songlist);
            let data = [];
            let serialNumber = 1;
            songlist.forEach(item =>{
                let song = {
                    id: item.id,
                    name: item.name,
                    singer: item.singer,
                    serialNumber: serialNumber++
                };
                data.push(song);
            });
            localStorage.setItem("playlist", JSON.stringify(data));
        }
    };

    function checkLogin() {
        if(loginState){
            if(userInfo.songlist){
                if(userInfo.songlist.indexOf(playlistId) != -1){
                    collectBtn.children[0].style.color = '#FF4800';
                    collectBtn.children[0].classList.value = 'layui-icon layui-icon-heart-fill';
                }
            }
        }
    }

    function changeCollectState(state){
        // 先剔除当前歌单再按需加入，避免重复收藏与拼接丢逗号
        let ids = (userInfo.songlist || '').split(',').filter(function (id) {
            return id && id !== playlistId;
        });
        if (state) {
            ids.push(playlistId);
        }
        userInfo.songlist = ids.join(',');
        $.ajax({
            url: API + "user/editUserInfo",
            data: {songlist: userInfo.songlist},
            dataType : "json",
            type : "post",
            success : function(res){
                if (res.code !== 0) {
                    layui.layer.msg(res.msg || '操作失败', {icon: 2});
                }
            },
            error: function() {

            }
        })
    }

    //收藏歌单点击事件
    collectBtn.onclick = function(){
        if(loginState){
            let value = collectBtn.children[0].classList.value;
            if(value === 'layui-icon layui-icon-heart-fill'){
                collectBtn.children[0].style.color = '';
                collectBtn.children[0].classList.value = 'layui-icon layui-icon-heart';
                changeCollectState(false);
                layui.layer.msg('已取消收藏');
            }else if(value === 'layui-icon layui-icon-heart'){
                collectBtn.children[0].style.color = '#FF4800';
                collectBtn.children[0].classList.value = 'layui-icon layui-icon-heart-fill';
                changeCollectState(true);
                layui.layer.msg('收藏成功');
            }
        }else {
            parent.location.href = "login";
        }
    };

    layui.use(['table', 'rate'], function () {
        const $ = layui.jquery,
            rate = layui.rate,
            layer = layui.layer,
            table = layui.table;

        rate.render({
            elem: '#unrated'
            ,value: 5
            ,text: true
            ,setText: function(value){
                this.span.html('<span style="font-size: 50px">'+ value + '</span>');
            }
            ,choose: function (data) {
                newRate = data;
                checkUserState(checkCallBack);
            }
        });

        const songsTable = table.render({
            elem: '#songsTable'
            , title: "歌单详情"
            , toolbar: ''
            // , height: 'full-300'
            , skin: 'nob'
            , cols: [
                [
                      {type: 'numbers', width: 50, unresize: true}
                    , {field: 'id', width: 60, align: 'center', unresize: true, templet: '#play'}
                    , {field: 'name', align: 'center', width: 200, unresize: true, title: '歌曲名'}
                    , {field: 'singer', align: 'center', width: 300, unresize: true, title: '歌手'}
                    , {field: 'album', align: 'center', unresize: true, title: '专辑'}
                ]
            ]
            , text: {
                none: ' ' //默认：无数据。
            }
            , data: []
        });

        layui.layer.ready(function () {
            $.ajax({
                url: API + "playlist/getPlaylistDetail?playlistId=" + playlistId,
                dataType : "json",
                type : "get",
                success : function(res){
                    if(res.msg == '操作成功'){
                        document.getElementById("cover").src = "image/songList/" + res.data.coverFileName;
                        $("#describeDetail").text(res.data.intro);
                        $("#title").text(res.data.name);
                        rate.render({
                            elem: '#rated'
                            ,value: res.data.rate
                            ,text: true
                            ,readonly:true
                            ,setText: function(value){
                                this.span.html('<span style="font-size: 50px">'+ value + '</span>');
                            }
                        });
                        let data = res.data.songlist;
                        table.reload('songsTable', {
                            data: data
                        });
                    }
                },
                error: function() {

                }
            })
        })
    });


</script>
</body>
</html>
