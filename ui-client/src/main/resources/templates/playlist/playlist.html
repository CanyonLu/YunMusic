<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>歌单</title>
    <link rel="stylesheet" href="lib/layui/css/layui.css"/>
    <link rel="stylesheet" href="style/index.css"/>
    <style>
        .layui-tab-title li{
            font-weight: 700;
            padding: 0 5px;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div id="songListDiv" class="layui-card layui-panel">
    <div class="layui-tab layui-tab-brief" lay-filter="playlistStyleFilter">
        <ul class="layui-tab-title">
            <li class="layui-this">全部歌单</li>
            <li>华语</li>
            <li>粤语</li>
            <li>欧美</li>
            <li>日韩</li>
            <li>纯音乐</li>
        </ul>
        <div class="layui-tab-content" style="height: 100px;">
            <div class="layui-tab-item layui-show"><div id="style_0"></div></div>
            <div class="layui-tab-item"><div id="style_1"></div></div>
            <div class="layui-tab-item"><div id="style_2"></div></div>
            <div class="layui-tab-item"><div id="style_3"></div></div>
            <div class="layui-tab-item"><div id="style_4"></div></div>
            <div class="layui-tab-item"><div id="style_5"></div></div>
        </div>
    </div>
</div>

<script src="js/common.js"></script>
<script>
    $(function () {
        loadPlaylist('style_0', 0);
    });

    /**
     * 加载歌单：style 为 0 表示全部
     */
    function loadPlaylist(containerId, style) {
        var url = API + 'playlist/getPlaylist';
        if (style) {
            url += '?style=' + style;
        }
        $.ajax({
            url: url,
            dataType: 'json',
            type: 'get',
            success: function (res) {
                if (res.code !== 0) {
                    return;
                }
                renderCardGrid('#' + containerId, res.data, {
                    imgPrefix: 'image/songList/',
                    imgField: 'coverFileName',
                    onClick: function (item) {
                        location.href = 'playlistDetail?playlistId=' + item.id;
                    }
                });
            }
        });
    }

    layui.use('element', function () {
        layui.element.on('tab(playlistStyleFilter)', function (data) {
            loadPlaylist('style_' + data.index, data.index);
        });
    });
</script>

</body>
</html>
