server:
  port: 8089
  servlet:
    # 应用的访问路径
    context-path: /client

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      url: jdbc:mysql://127.0.0.1:3306/lcy?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UTC
      username: root
      password: 583590
      driver-class-name: com.mysql.cj.jdbc.Driver



# MyBatis
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.lcy.entity
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath:mybatis/**/*Mapper.xml
  configLocation: classpath:mybatis/mybatis-config.xml