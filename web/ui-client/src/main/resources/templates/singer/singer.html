<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>歌单</title>
    <link rel="stylesheet" href="lib/layui/css/layui.css"/>
    <link rel="stylesheet" href="style/index.css"/>
    <style>
        .layui-tab-title li{
            font-weight: 700;
            padding: 0 10px;
            font-size: 15px;
        }
        #singerListDiv{
            width: 70%;
            margin: 0 auto
        }
    </style>
</head>
<body>

<div id="singerListDiv" class="layui-card layui-panel">
    <div class="layui-tab layui-tab-brief" lay-filter="singerGenderFilter">
        <ul class="layui-tab-title">
            <li class="layui-this">全部歌手</li>
            <li>男歌手</li>
            <li>女歌手</li>
            <li>歌手组合</li>
        </ul>
        <div class="layui-tab-content" style="height: 100px;">
            <div class="layui-tab-item layui-show"><div id="singer_0"></div></div>
            <div class="layui-tab-item"><div id="singer_1"></div></div>
            <div class="layui-tab-item"><div id="singer_2"></div></div>
            <div class="layui-tab-item"><div id="singer_3"></div></div>
        </div>
    </div>
</div>

<script src="js/common.js"></script>
<script>

    let domid = 'singer_0';

    $(function () {
        $.ajax({
            url: realm_dev + client + "singer/getSingerList",
            dataType : "json",
            type : "get",
            success : CreateSingerListElementForAjaxSuccess,
            error: function(res) {

            }
        })
    });

    function singerDetail(id){
        location.href = 'singerDetail?singerId=' + id;
    }

    var CreateSingerListElementForAjaxSuccess = function(res){
        if(res.msg == '操作成功'){
            let singerlist = res.data;
            let rownum = Math.ceil(singerlist.length/4);
            let singerlistdiv = document.querySelector("#" + domid);
            let num = 0;
            let everyRowHasNum = singerlist.length < 4? singerlist.length : 4;
            for(let i = 0; i < rownum; i++){
                let rowdiv = document.createElement("div");
                rowdiv.className = "layui-row layui-col-space15";
                if(i === (rownum - 1)){
                    rowdiv.id = "songListLastRow";
                    everyRowHasNum = singerlist.length < 4? singerlist.length : singerlist.length % 4;
                }
                for(let j = 0; j < everyRowHasNum; j++){
                    let everydiv = document.createElement("div");
                    everydiv.className = "layui-col-md3";
                    let paneldiv = document.createElement("div");
                    paneldiv.className = "layui-panel";
                    let pica = document.createElement("a");
                    pica.setAttribute("href","javascript:;");
                    pica.setAttribute("title", singerlist[num].name);
                    pica.setAttribute("onclick", "singerDetail(" + singerlist[num].id + ")");
                    let picimg = document.createElement("img");
                    picimg.className = "cover";
                    picimg.src = "image/singer/" + singerlist[num].photoFileName;
                    pica.appendChild(picimg);
                    let titlediv = document.createElement("div");
                    titlediv.className = "subheadDiv";
                    let titlea = document.createElement("a");
                    titlea.setAttribute("href","javascript:;");
                    titlea.setAttribute("title", singerlist[num].name);
                    let strong = document.createElement("strong");
                    strong.className = "subhead";
                    strong.innerText = singerlist[num].name;
                    titlea.appendChild(strong);
                    titlediv.appendChild(titlea);
                    paneldiv.appendChild(pica);
                    paneldiv.appendChild(titlediv);
                    everydiv.appendChild(paneldiv);
                    rowdiv.appendChild(everydiv);
                    num ++;
                }
                singerlistdiv.appendChild(rowdiv);
            }
        }
    };

    layui.use('element',function () {
        var $ = layui.jquery,
            element = layui.element;

        element.on('tab(singerGenderFilter)',function (data) {
            const index = data.index;
            domid = 'singer_' + index;
            $("#"+domid).html("");
            let url = realm_dev + client + "singer/getSingerList";
            if(index != 0){
                url = url + "?gender=" + index;
            }
            $.ajax({
                url: url,
                dataType : "json",
                type : "get",
                success : CreateSingerListElementForAjaxSuccess,
                error: function(res) {

                }
            })



        })
    })


</script>

</body>
</html>
