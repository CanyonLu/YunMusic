<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>歌单</title>
    <link rel="stylesheet" href="lib/layui/css/layui.css"/>
    <link rel="stylesheet" href="style/index.css"/>
    <style>
        .layui-tab-title li{
            font-weight: 700;
            padding: 0 5px;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div id="songListDiv" class="layui-card layui-panel">
    <div class="layui-tab layui-tab-brief" lay-filter="playlistStyleFilter">
        <ul class="layui-tab-title">
            <li class="layui-this">全部歌单</li>
            <li>华语</li>
            <li>粤语</li>
            <li>欧美</li>
            <li>日韩</li>
            <li>纯音乐</li>
        </ul>
        <div class="layui-tab-content" style="height: 100px;">
            <div class="layui-tab-item layui-show"><div id="style_0"></div></div>
            <div class="layui-tab-item"><div id="style_1"></div></div>
            <div class="layui-tab-item"><div id="style_2"></div></div>
            <div class="layui-tab-item"><div id="style_3"></div></div>
            <div class="layui-tab-item"><div id="style_4"></div></div>
            <div class="layui-tab-item"><div id="style_5"></div></div>
        </div>
    </div>
</div>

<script src="js/common.js"></script>
<script>

    let domid = 'style_0';

    $(function () {
        $.ajax({
            url: realm_dev + client + "playlist/getPlaylist",
            dataType : "json",
            type : "get",
            success : CreatePlaylistElementForAjaxSuccess,
            error: function(res) {

            }
        })
    });

    function showPlaylistDetail(id){
        location.href = 'playlistDetail?playlistId=' + id;
    }

    var CreatePlaylistElementForAjaxSuccess = function(res){
        if(res.msg == '操作成功'){
            let songlist = res.data;
            let rownum = Math.ceil(songlist.length/5);
            let songlistdiv = document.querySelector("#" + domid);
            let num = 0;
            let everyRowHasNum = 5;
            for(let i = 0; i < rownum; i++){
                let rowdiv = document.createElement("div");
                rowdiv.className = "layui-row layui-col-space15";
                if(i === (rownum - 1)){
                    rowdiv.id = "songListLastRow";
                    everyRowHasNum = songlist.length < 5? songlist.length : songlist.length % 5 === 0? 5 : songlist.length % 5;
                }
                for(let j = 0; j < everyRowHasNum; j++){
                    let everydiv = document.createElement("div");
                    everydiv.className = "layui-col-md3";
                    let paneldiv = document.createElement("div");
                    paneldiv.className = "layui-panel";
                    let pica = document.createElement("a");
                    pica.setAttribute("href","javascript:;");
                    pica.setAttribute("title", songlist[num].name);
                    pica.setAttribute("onclick", "showPlaylistDetail(" + songlist[num].id + ")");
                    let picimg = document.createElement("img");
                    picimg.className = "cover";
                    picimg.src = "image/songList/" + songlist[num].coverFileName;
                    pica.appendChild(picimg);
                    let titlediv = document.createElement("div");
                    titlediv.className = "subheadDiv";
                    let titlea = document.createElement("a");
                    titlea.setAttribute("href","javascript:;");
                    titlea.setAttribute("title", songlist[num].name);
                    let strong = document.createElement("strong");
                    strong.className = "subhead";
                    strong.innerText = songlist[num].name;
                    titlea.appendChild(strong);
                    titlediv.appendChild(titlea);
                    paneldiv.appendChild(pica);
                    paneldiv.appendChild(titlediv);
                    everydiv.appendChild(paneldiv);
                    rowdiv.appendChild(everydiv);
                    num ++;
                }
                songlistdiv.appendChild(rowdiv);
            }
        }
    };

    layui.use('element',function () {
        var $ = layui.jquery,
            element = layui.element;

        element.on('tab(playlistStyleFilter)',function (data) {
            const index = data.index;
            domid = 'style_' + index;
            $("#"+domid).html("");
            let url = realm_dev + client + "playlist/getPlaylist";
            if(index != 0){
                url = url + "?style=" + index;
            }
            $.ajax({
                url: url,
                dataType : "json",
                type : "get",
                success : CreatePlaylistElementForAjaxSuccess
            })
        })
    })


</script>

</body>
</html>
