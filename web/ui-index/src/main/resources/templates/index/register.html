<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>注册</title>
<!--    <link rel="stylesheet" href="style/style.css"/>-->
    <link rel="stylesheet" href="lib/layui/css/layui.css"/>
    <style>
        #register-form{
            margin-right: 65px;
            margin-top: 30px;
        }
        .layui-form-item{
            margin-bottom: 0px;
        }
        .divTips{
            width: 100%;
            height: 15px;
        }

    </style>
</head>
<body>
<form class="layui-form" id="register-form">
    <div class="layui-form-item">
        <label class="layui-form-label">账号</label>
        <div class="layui-input-inline">
            <input type="text" name="account" id="account" required  lay-verify="required" placeholder="请输入账号" autocomplete="off" class="layui-input" onblur="checkAccount(this.value)">
            <div id="accountDiv" class="divTips"></div>
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">密码</label>
        <div class="layui-input-inline">
            <input type="password" name="password" id="password" required lay-verify="required" placeholder="请输入密码" autocomplete="off" class="layui-input" onblur="checkPassword(this.value)">
            <div id="passwordDiv" class="divTips"></div>
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">确认密码</label>
        <div class="layui-input-inline">
            <input type="password" name="confirmPassword" id="confirmPassword" required lay-verify="required" placeholder="请再次输入密码" autocomplete="off" class="layui-input" onblur="checkConfirmPassword(this.value)">
            <div id="confirmPasswordDiv" class="divTips"></div>
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">昵称</label>
        <div class="layui-input-inline">
            <input type="text" name="nickname" id="nickname" required  lay-verify="required" placeholder="请输入昵称" autocomplete="off" class="layui-input" onblur="checkNickname(this.value)">
            <div id="nicknameDiv" class="divTips"></div>
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">性别</label>
        <div class="layui-input-block">
            <input type="radio" name="sex" value="male" title="男">
            <input type="radio" name="sex" value="female" title="女" checked>
            <div id="sexDiv" class="divTips"></div>
        </div>
    </div>
    <div class="layui-form-item">
        <div class="layui-input-block">
            <button type="button" class="layui-btn layui-btn-primary" lay-submit="" lay-filter="registerBtn">立即注册</button>
            <button type="reset" class="layui-btn layui-btn-primary">重置</button>
        </div>
    </div>
</form>
<script src="js/common.js"></script>
<script>

    var accountOK, passwordOK, confirmPasswordOK, nicknameOK;

    layui.use('form', function(){
        var form = layui.form,
            $ = layui.jquery;

        //监听提交
        form.on('submit(registerBtn)', function(data){
            if(!accountOK){
                layer.msg("请重新输入账号！", {icon: 2});
                return false;
            }

            if(!passwordOK){
                layer.msg("请重新输入密码！", {icon: 2});
                return false;
            }

            if(!confirmPasswordOK){
                layer.msg("请重新输入密码！", {icon: 2});
                return false;
            }

            if(!nicknameOK){
                layer.msg("请重新输入昵称！", {icon: 2});
                return false;
            }

            let params = {
                params : JSON.stringify(data.field)
            };
            // 遮罩
            let loading = layer.load(2, {shade: [0.3, 'fff'], time: 10 * 1000});
            $.ajax({
                url : realm_dev + index + "user/userRegister",
                data : params,
                dataType : "json",
                type : "post",
                success : function(res){
                    layer.closeAll('loading'); //关闭加载层
                    if(res.code == 0){
                        localStorage.setItem("token", res.data.token);
                        layer.msg("注册成功！", {icon: 1});
                        setTimeout(function(){
                            let addSuccessindex = parent.layer.getFrameIndex(window.name);
                            parent.layer.close(addSuccessindex);
                            parent.location.href = "index";
                            return false;
                        },1000);
                    }else {
                        layer.msg("注册失败，请重试！", {icon: 2});
                    }
                },
                error : function(data){

                }
            });
        });
    });

    /**
     * 验证账号
     * @param data
     */
    function checkAccount(data) {
        if(data){
            //todo 正则验证
            //后台查询账号是否重复
            let params = {
                params : JSON.stringify({account : data})
            };
            $.ajax({
                url : realm_dev + index + "user/checkUserInfo",
                data : params,
                dataType : "json",
                type : "post",
                success : function(data){
                    if(data.code == 500){
                        accountOK = false;
                        document.getElementById("accountDiv").innerHTML = '<i class="layui-icon layui-icon-close-fill" style="font-size: 15px; color: red;">该账号已被注册</i>';
                    }else {
                        accountOK = true;
                        document.getElementById("accountDiv").innerHTML = '<i class="layui-icon layui-icon-ok-circle" style="font-size: 15px; color: green;">该账号可以使用</i>';
                    }
                },
                error : function(data){
                    layer.msg("系统忙！", {icon: 3});
                }
            });
        }
    }

    /**
     *验证密码
     * @param data
     */
    function checkPassword(data) {
        if(data){
            let confirmPassword = $("#confirmPassword").val();
            if(confirmPassword && confirmPassword != data){
                passwordOK = false;
            }else {
                passwordOK = true;
            }
        }
    }

    /**
     * 验证密码
     * @param data
     */
    function checkConfirmPassword(data) {
        if(data){
            let password = $("#password").val();
            if(password && password != data){
                confirmPasswordOK = false;
                document.getElementById("confirmPasswordDiv").innerHTML = '<i class="layui-icon layui-icon-close-fill" style="font-size: 15px; color: red;">两次输入的密码不一致！</i>';
            }else {
                confirmPasswordOK = true;
                document.getElementById("confirmPasswordDiv").innerHTML = '<i class="layui-icon layui-icon-ok-circle" style="font-size: 15px; color: green;">密码可以使用</i>';
            }
        }
    }

    /**
     * 验证昵称
     * @param data
     */
    function checkNickname(data) {
        //todo
        if(data){
            nicknameOK = true;
            document.getElementById("nicknameDiv").innerHTML = '<i class="layui-icon layui-icon-ok-circle" style="font-size: 15px; color: green;"></i>';
        }
    }
</script>
</body>
</html>
