<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="style/style.css"/>
    <link rel="stylesheet" href="lib/layui/css/layui.css"/>
</head>
<body>
    <div class="box">
        <h2>Login</h2>
        <div class="input-box">
            <label>账号</label>
            <input type="text" id="account"/>
        </div>
        <div class="input-box">
            <label>密码</label>
            <input type="password" id="password"/>
        </div>
        <div class="btn-box">
            <a href="#">忘记密码?</a>
            <div>
                <button id="login">登录</button>
                <button id="register">注册</button>
            </div>
        </div>
    </div>
<script src="js/common.js"></script>
<script>

    $(function () {
        if(localStorage.getItem("token")){
            history.back(-1);
        }
    });

    layui.use(['layer'], function () {
        var $ = layui.jquery,
            layer = layui.layer;


        $("#register").click(function () {

            layer.open({
                type : 2,
                title : "注册",
                maxmin : true,
                area : [ '450px', '500px' ],
                content : 'register'
            });
        });

        $("#login").click(function () {
            let account = $("#account").val();
            let password = $("#password").val();
            if(!account){
                layer.msg("请输入账号！", {icon: 2});
                return false;
            }
            if(!password){
                layer.msg("请输入密码！", {icon: 2});
                return false;
            }
            $.ajax({
                url : realm_dev + index + "user/userLogin",
                data : {account: account, password: password},
                dataType : "json",
                type : "post",
                success : function(res){
                    if(res.code == 0){
                        localStorage.setItem("token", res.data.token);
                        layer.msg(res.data.nickname + '您好，欢迎登录！');
                        setTimeout(function(){
                            location.href = "index";
                            return false;
                        },1500);
                    }else {
                        layer.msg(res.msg, {time: 1500,shade : [0.5 , '#000' , true]});
                    }
                },
                error : function(data){

                }
            });
        })
    })





</script>
    
</body>
</html>
