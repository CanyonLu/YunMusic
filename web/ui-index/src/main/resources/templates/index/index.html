<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Yun-Music 云音乐</title>
    <link rel="stylesheet" href="lib/layui/css/layui.css"/>
    <link rel="stylesheet" href="style/index.css"/>
    <link rel="shortcut icon" href="image/favicon.ico" type="image/x-icon"/>
</head>
<body>
<div class="layui-layout layui-layout-admin">
    <div class="layui-header">
        <ul class="layui-nav layui-tab-card" lay-filter="menu">
            <li class="layui-nav-item" lay-unselect="" id="logoLi"><a href="javascript:;" ><i class="layui-icon layui-icon-headset">&emsp;Yun-Music</i></a></li>
            <li class="layui-nav-item layui-this" id="indexLi"><a href="javascript:;">首页</a></li>
            <li class="layui-nav-item"><a href="javascript:;">歌单</a></li>
            <li class="layui-nav-item"><a href="javascript:;">歌手</a></li>
            <li class="layui-nav-item"><a href="javascript:;">我的音乐</a></li>
            <li class="layui-nav-item" id="searchLi">
                <input class="user-input" type="text" name="search" placeholder="搜索音乐、歌手、专辑">
                <button class="user-btn" type="button">
                    <i class="layui-icon layui-icon-search" style="font-size: 26px"></i>
                </button>
            </li>
            <span id="notLogin" style="display: none">
                <li class="layui-nav-item" lay-unselect=""><a href="javascript:;" style="font-size: 18px; padding: 0 10px; color: #000000">登录</a></li>
                <li class="layui-nav-item" lay-unselect=""><a href="javascript:;" style="font-size: 18px; padding: 0 10px; color: #000000">注册</a></li>
            </span>
            <span id="logined"  style="display: none">
                <li class="layui-nav-item layui-hide layui-show-md-inline-block">
                    <a href="javascript:;"><img src="//t.cn/RCzsdCq" class="layui-nav-img"></a>
                    <dl class="layui-nav-child">
                        <dd><a href="javascript:;" class="userinfo">个人中心</a></dd>
                        <dd><a href="javascript:;" class="userinfo">修改密码</a></dd>
                        <hr>
                        <dd style="text-align: center;"><a href="javascript:;" class="userinfo">退出</a></dd>
                    </dl>
                </li>
            </span>
        </ul>
    </div>

    <div class="layui-body">
        <div class="layui-tab-content">
            <div id="indexIframe" style="height: 100%" class="layui-tab-item layui-show"></div>
        </div>
    </div>

    <div class="layui-footer">
        <audio src="audio/胡海泉 - 先走的人.mp3" preload=""></audio>
        <div class="control-back">
            <!-- 进度条 -->
            <div class="progress-bar">
                <div class="progress-all"></div>
                <div class="progress-now"></div>
            </div>
            <span class="time">00:00/00:00</span>
            <!-- 控制按钮 -->
            <div class="control">
<!--                <div class="albumPictures">-->
<!--                    <img src="./image/album/default.jpg" style="width: 60px"></img>-->
<!--                </div>-->
                <!-- 上一首、下一首、暂停播放 -->
                <div class="control-btn">
                    <a href="javascript:;" class="up"><i class="layui-icon layui-icon-left"></i></a>
                    <a href="javascript:;" class="play-pause" onclick="setPlay()"><i class="layui-icon layui-icon-play"></i></a>
                    <a href="javascript:;" class="down"><i class="layui-icon layui-icon-right"></i></a>
                </div>
                <!-- 播放模式、声音 -->
                <div class="control-right">
                    <a href="javascript:;" class="mode"></a>
                    <a href="javascript:;" class="volume" onclick="setMuted()"><i class="layui-icon layui-icon-speaker"></i></a>
                    <div class="volume-back">
                        <div class="volume-all"></div>
                        <div class="volume-now"></div>
                    </div>
                    <span class="volume-text">100</span>
                </div>
            </div>
        </div>
    </div>


</div>




<script src="js/common.js"></script>
<script src="js/playerControl.js"></script>
<script>

    var nowPage = '首页';
    $(function () {
        if(false){
            $("#logined").css('display','inline');
        }else {
            $("#notLogin").css('display','inline');
        }

        $("#indexIframe").html('<iframe width="100%" height="100%" frameborder="no" border="0" marginwidth="0" narginheight="0" src="home"></iframe>');
    });

    var loggedinfun = function (){
        $("#notLogin").css('display','none');
        $("#logined").css('display','inline');
    };

    layui.use(['element'], function(){
        var $ = layui.jquery,
            element = layui.element;

        checkstate(loggedinfun);

        element.on('nav(menu)', function(data){
            let newPage = data.text();
            //判断是否重复点击同一个模块
            if(nowPage == newPage){
                return false;
            }
            //判断点击模块
            switch (newPage) {
                case '首页':
                    $("#indexIframe").html('<iframe width="100%" height="100%" frameborder="no" border="0" marginwidth="0" narginheight="0" src="home"></iframe>');
                    break;
                case '歌单':
                    $("#indexIframe").html('<iframe width="100%" height="100%" frameborder="no" border="0" marginwidth="0" narginheight="0" src="playlist"></iframe>');
                    break;
                case '登录':
                    window.location = 'login';
                    break;
                case '退出':
                    localStorage.removeItem("token");
                    layer.msg('退出成功');
                    setTimeout(function(){
                        location.reload();
                    },1000);
                    break;
                case '注册':
                    layer.open({
                        type : 2,
                        title : "注册",
                        maxmin : true,
                        area : [ '450px', '500px' ],
                        content : 'register'
                    });
                    break;
                default:
                    break;
            }
            nowPage = document.getElementsByClassName('layui-nav-item layui-this')[0].children[0].textContent;
        });
    });


</script>
</body>
</html>
