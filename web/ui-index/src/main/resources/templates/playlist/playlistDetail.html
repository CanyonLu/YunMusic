<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>歌单详情</title>
    <link rel="stylesheet" href="lib/layui/css/layui.css"/>
    <link rel="stylesheet" href="style/index.css"/>
    <style>
        #main{
            width: 80%;
            margin: 0 auto;
            padding-right: 8%;
        }
    </style>
</head>
<body>
<div id="main" class="layui-row layui-col-space15">
    <div class="layui-col-md5">
        <div id="left" style="background-color: #0000FF">7/12</div>
    </div>
    <div class="layui-col-md7">
        <div id="right" style="background-color: #92B8B1">
            <table id="songsTable" lay-filter="songsTable"></table>
        </div>
    </div>
</div>

<script src="js/common.js"></script>
<script>


    layui.use(['table'], function () {
        const $ = layui.jquery,
            table = layui.table;


        const songsTable = table.render({
            elem: '#songsTable'
            , title: "歌单详情"
            , url: ''
            , toolbar: ''
            , cellMinWidth: 80
            // , height: 'full-142'
            //, smartReloadModel: true
            , cols: [
                [
                      {type: 'number'}
                    , {field: 'title', align: 'center', width: 180, title: '歌曲名'}
                    , {field: 'singer', align: 'center', width: 180, title: '歌手'}
                    , {field: 'album', align: 'center', width: 180, title: '专辑'}

                ]
            ]
            , where: {
                // searchParams: resultData()
            }
            , page: true
            , even: true
            , sort: true
            , done: function (res, curr, count) {

            }
        });

    });


</script>
</body>
</html>
